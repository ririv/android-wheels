args = ["no-shared", "no-tests"]
licenses = ["LICENSE.txt"]

[crc32c]
version = "1.1.2"
filename = "crc32c-02e65f4fd3065d27b2e29324800ca6d04df16126.tar.gz"
url = "https://codeload.github.com/google/crc32c/tar.gz/02e65f4fd3065d27b2e29324800ca6d04df16126"
