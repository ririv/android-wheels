args = ["-DBUILD_SHARED_LIBS=ON", "-DLIBXSLT_WITH_PYTHON=OFF", "-DLIBXSLT_WITH_DEBUGGER=ON", "-DLIBXSLT_WITH_TESTS=OFF", "-DLIBXSLT_WITH_PROGRAMS=OFF", "-DCMAKE_PREFIX_PATH={prefix}", "-DCMAKE_FIND_ROOT_PATH={prefix}"]
licenses = ["Copyright"]

[geos]
