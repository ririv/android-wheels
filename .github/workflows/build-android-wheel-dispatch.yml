name: Reusable - Build one Android target

on:
  workflow_call:
    inputs:
      target:
        description: Resolved source and one Python/ABI target as JSON
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ fromJSON(inputs.target).builder }} / ${{ fromJSON(inputs.target).abi }}
    runs-on: ubuntu-latest
    env:
      LIBRARY_NAME: ${{ fromJSON(inputs.target).library }}
      GIT_REPOSITORY: ${{ fromJSON(inputs.target).source.repository }}
      VERSION_TAG: ${{ fromJSON(inputs.target).source.sha }}
      SOURCE_DIR: ${{ fromJSON(inputs.target).source.directory }}
      PACKAGE_DIR: ${{ fromJSON(inputs.target).source.directory }}
      TARGET_PYTHON_VERSION: ${{ fromJSON(inputs.target).python }}
      ANDROID_API: ${{ fromJSON(inputs.target).api }}
      TARGET_ABI: ${{ fromJSON(inputs.target).abi }}
      ARTIFACT: ${{ fromJSON(inputs.target).artifact }}
      WHEEL_DIRECTORY: ${{ fromJSON(inputs.target).builder == 'cibuildwheel' && 'wheelhouse' || 'output' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/prepare-source
        with:
          target: ${{ inputs.target }}
      - name: Set up host Python matching target
        if: fromJSON(inputs.target).builder != 'cibuildwheel'
        id: host_python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ fromJSON(inputs.target).python }}
          update-environment: false

      - name: Build with maturin
        if: fromJSON(inputs.target).builder == 'maturin'
        env:
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: |
          python -m venv "$RUNNER_TEMP/android-wheel-build-env"
          source "$RUNNER_TEMP/android-wheel-build-env/bin/activate"
          python -m pip install -r requirements/build.txt
          python scripts/build/build_android_wheel.py

      - name: Install Rust target for cibuildwheel
        if: fromJSON(inputs.target).builder == 'cibuildwheel'
        env:
          RUST_TARGET: ${{ fromJSON(inputs.target).triplet }}
        run: rustup target add "$RUST_TARGET"
      - name: Select cibuildwheel Python
        if: fromJSON(inputs.target).builder == 'cibuildwheel'
        run: echo "CIBW_BUILD=cp${TARGET_PYTHON_VERSION//./}-*" >> "$GITHUB_ENV"
      - name: Build with cibuildwheel
        if: fromJSON(inputs.target).builder == 'cibuildwheel'
        uses: pypa/cibuildwheel@v4.3.4
        with:
          package-dir: library-source/${{ fromJSON(inputs.target).source.directory }}
        env:
          CIBW_PLATFORM: android
          CIBW_ARCHS: ${{ fromJSON(inputs.target).cibw_arch }}
          CIBW_ENVIRONMENT: 'ANDROID_API_LEVEL=${{ fromJSON(inputs.target).api }} CARGO_BUILD_TARGET=${{ fromJSON(inputs.target).triplet }} CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ fromJSON(inputs.target).api }}-clang CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android${{ fromJSON(inputs.target).api }}-clang PYO3_CROSS=1'
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_SKIP: '*'
          CIBW_REPAIR_WHEEL_COMMAND_ANDROID: 'python "$GITHUB_WORKSPACE/scripts/build/repair_android_wheel.py" {wheel} {dest_dir} {ldpaths}'
          CIBW_BEFORE_BUILD: |
            python -m pip install 'tomli-w==1.2.0'
            python "$GITHUB_WORKSPACE/scripts/pipeline/cargo_env.py" "{package}" "$VIRTUAL_ENV"

      - name: Checkout Chaquopy build tools
        if: fromJSON(inputs.target).builder == 'chaquopy'
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: 6e365e30f7199468d9fffe628fe9f0a7658fdbb3
          path: chaquopy
          persist-credentials: false
      - name: Build with Chaquopy
        if: fromJSON(inputs.target).builder == 'chaquopy'
        env:
          HOST_PYTHON: ${{ steps.host_python.outputs.python-path }}
        run: |
          git -C chaquopy apply "$GITHUB_WORKSPACE/scripts/build/patches/chaquopy-libpython-link.patch"
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m venv "$RUNNER_TEMP/chaquopy-build-env"
          source "$RUNNER_TEMP/chaquopy-build-env/bin/activate"
          python -m pip install -r chaquopy/server/pypi/requirements.txt
          python scripts/build/build_chaquopy_wheel.py

      - name: Validate wheel and record build provenance
        run: python -B -m scripts.pipeline record --artifact "$ARTIFACT" --directory "$WHEEL_DIRECTORY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.WHEEL_DIRECTORY }}/*
          if-no-files-found: error
