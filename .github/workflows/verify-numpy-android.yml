name: Verify NumPy on Android

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Completed NumPy Python 3.13 build run ID'
        type: string
        required: true
      artifact_layout:
        description: 'Artifact layout produced by the selected run'
        type: choice
        options: [build, repackaged]
        default: build
        required: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - uses: actions/download-artifact@v5
        with:
          name: build-plan
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verification/plan
      - uses: actions/download-artifact@v5
        if: inputs.artifact_layout == 'build'
        with:
          pattern: numpy-android-3.13-wheel-*
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verification/artifacts
      - uses: actions/download-artifact@v5
        if: inputs.artifact_layout == 'repackaged'
        with:
          name: repackaged-wheels
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: verification/artifacts
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run verified x86_64 wheel on Android API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python -B -m scripts.testing.android_runtime --plan verification/plan/build-plan.json --artifact verification/artifacts/numpy-android-3.13-wheel-x86_64 --adb "$ANDROID_HOME/platform-tools/adb" --serial emulator-5554 --toolchain "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64" --script scripts/testing/numpy_smoke.py --report verification/numpy-x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: numpy-runtime-x86_64
          path: verification/numpy-x86_64.json
          if-no-files-found: error
