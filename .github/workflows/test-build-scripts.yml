name: Validate build pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'recipes/**'
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'recipes/**'
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.4'
      - name: Install locked development tools
        run: uv sync --locked --no-install-project --python "$(command -v python)"
      - name: Check Python and TOML
        run: |
          uv run --no-sync ruff check scripts/pipeline scripts/recipes scripts/index scripts/generate_index.py
          uv run --no-sync ruff format --check scripts/pipeline scripts/recipes scripts/index scripts/generate_index.py
          uv run --no-sync python -B -m scripts.recipes validate
      - name: Test pipeline components
        run: |
          uv run --no-sync python -B -m unittest discover -s scripts/build/tests -v
          uv run --no-sync python -B -m unittest discover -s scripts/recipes/tests -v
          uv run --no-sync python -B -m unittest discover -s scripts/pipeline/tests -v
          uv run --no-sync python -B -m unittest discover -s scripts/index/tests -v
      - name: Checkout pinned Chaquopy build tools
        uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: 6e365e30f7199468d9fffe628fe9f0a7658fdbb3
          path: chaquopy
          persist-credentials: false
      - name: Check build-tool patch
        run: git -C chaquopy apply --check "$GITHUB_WORKSPACE/scripts/build/patches/chaquopy-libpython-link.patch"
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
