name: Validate build pipeline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'recipes/**'
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'scripts/**'
      - 'recipes/**'
      - '.github/**'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@v4
      - name: Read central tool settings
        id: tools
        run: python3 -B -m scripts.tooling outputs --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ steps.tools.outputs.uv_version }}
      - name: Install locked development tools
        run: uv sync --locked --no-install-project --python "$(command -v python)"
      - name: Check Python and TOML
        run: |
          uv run --no-sync ruff check scripts
          uv run --no-sync ruff format --check scripts
          uv run --no-sync python -B -m scripts.recipes validate
      - name: Test pipeline components
        run: |
          uv run --no-sync python -B -m unittest discover -s scripts/build/tests -v
          uv run --no-sync python -B -m unittest discover -s scripts/recipes/tests -v
          uv run --no-sync python -B -m unittest discover -s scripts/pipeline/tests -v
          uv run --no-sync python -B -m unittest discover -s scripts/index/tests -v
      - name: Checkout pinned Chaquopy build tools
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.tools.outputs.chaquopy_repository }}
          ref: ${{ steps.tools.outputs.chaquopy_revision }}
          path: chaquopy
          persist-credentials: false
      - name: Check build-tool patch
        run: git -C chaquopy apply --check "$GITHUB_WORKSPACE/scripts/build/patches/chaquopy-libpython-link.patch"
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read central tool settings
        id: tools
        run: python3 -B -m scripts.tooling outputs --github-output "$GITHUB_OUTPUT"
      - name: Check Actions workflows
        env:
          ACTIONLINT_VERSION: ${{ steps.tools.outputs.actionlint_version }}
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
