name: Build wheels from recipes

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'scripts/recipes/**'
      - 'scripts/__init__.py'
      - 'scripts/build/**'
      - 'scripts/pipeline/**'
      - '.github/actions/**'
      - 'requirements/build.txt'
      - '!scripts/**/tests/**'
      - '!scripts/**/*.pyc'
      - '.github/workflows/build-wheels.yml'
      - '.github/workflows/build-android-wheel-dispatch.yml'
  workflow_dispatch:
    inputs:
      recipes:
        description: 'Recipe names separated by commas, or all'
        required: true
        type: string
        default: 'pydantic-core'
      python_versions:
        description: 'recipe uses TOML defaults; otherwise comma-separated versions such as 3.10,3.13'
        required: true
        type: string
        default: 'recipe'
      version_tag:
        description: 'Override Git ref for a single selected recipe'
        required: false
        type: string
      publication:
        description: 'publish updates the wheel index; build keeps artifacts in Actions only'
        required: true
        type: choice
        options: [publish, build]
        default: publish

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      publication: ${{ steps.plan.outputs.publication }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Plan pinned independent targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.pipeline plan --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          if-no-files-found: error

  build:
    name: ${{ matrix.library }} / Python ${{ matrix.python }} / ${{ matrix.abi }}
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-android-wheel-dispatch.yml
    with:
      target: ${{ toJSON(matrix) }}

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publication == 'publish' && needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/publish-wheels
