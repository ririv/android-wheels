name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - wheels
    paths:
      # Trigger when the index script on main changes, or when any wheel on wheels changes.
      - 'scripts/generate_index.py'
      - '.github/workflows/pages.yml'
      - '**/*.whl'
  workflow_dispatch:

# Wheel uploads run in parallel and each triggers a deploy. Every deploy rebuilds from the latest
# 'wheels' head, so serialize them and let a newer pending deploy replace an older one; this keeps
# an older snapshot from finishing last and overwriting the site.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check compatibility notification credentials
        env:
          GH_TOKEN: ${{ secrets.LEGACY_INDEX_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::请配置 LEGACY_INDEX_DISPATCH_TOKEN，仅授权 ririv.github.io 的 Actions: write"
            exit 1
          fi
          gh api repos/ririv/ririv.github.io/actions/workflows/sync-wheel-index.yml --silent

      - name: Checkout wheels branch
        uses: actions/checkout@v4
        with:
          ref: wheels
          fetch-depth: 0 # Fetch all history for git log to work correctly

      - name: Download index script
        run: |
          mkdir -p scripts
          curl -L -o scripts/generate_index.py https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/generate_index.py

      - name: Generate index
        run: python scripts/generate_index.py

      - name: Record published index tree
        id: previous_index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INDEX_TREE=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq '.commit.tree.sha')
          echo "tree=$INDEX_TREE" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true

      - name: Read published index tree
        id: published_index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INDEX_TREE=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq '.commit.tree.sha')
          echo "tree=$INDEX_TREE" >> "$GITHUB_OUTPUT"

      - name: Notify compatibility index of changed content
        if: steps.previous_index.outputs.tree != steps.published_index.outputs.tree
        env:
          GH_TOKEN: ${{ secrets.LEGACY_INDEX_DISPATCH_TOKEN }}
        run: |
          gh workflow run sync-wheel-index.yml --repo ririv/ririv.github.io --ref main
