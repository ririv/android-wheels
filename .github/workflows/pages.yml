name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - wheels
    paths:
      # Trigger when the index script on main changes, or when any wheel on wheels changes.
      - 'scripts/generate_index.py'
      - 'scripts/index/**'
      - 'scripts/pipeline/notifications.py'
      - '!scripts/index/tests/**'
      - '.github/workflows/pages.yml'
      - '**/*.whl'
  workflow_dispatch:

# 不同构建运行可能同时发布；串行部署最新 wheels，合并等待中的重复通知。
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check compatibility notification credentials
        env:
          GH_TOKEN: ${{ secrets.LEGACY_INDEX_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::请配置 LEGACY_INDEX_DISPATCH_TOKEN，仅授权 ririv.github.io 的 Actions: write"
            exit 1
          fi
          gh api repos/ririv/ririv.github.io/actions/workflows/sync-wheel-index.yml --silent

      - name: Checkout index code
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/setup-tools
      - name: Checkout wheel metadata without wheel binaries
        uses: actions/checkout@v4
        with:
          ref: wheels
          path: wheel-store
          fetch-depth: 0
          sparse-checkout: .index-metadata
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Generate index with batched Git metadata
        env:
          WHEEL_REPOSITORY: ${{ github.repository }}
        run: python -B -m scripts.generate_index --checkout wheel-store --repository "$WHEEL_REPOSITORY" --output public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          force_orphan: true

      - name: Ensure compatibility index is synchronized
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_INDEX_DISPATCH_TOKEN: ${{ secrets.LEGACY_INDEX_DISPATCH_TOKEN }}
        run: python -B -m scripts.pipeline notify-legacy --repository "$GITHUB_REPOSITORY"
