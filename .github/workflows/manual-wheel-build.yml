name: Manual Build Wheel

on:
  workflow_dispatch:
    inputs:
      library_name:
        description: 'Name of the library (e.g., my-lib)'
        required: true
        type: string
      git_repository:
        description: 'Git repository URL (e.g., org/repo)'
        required: true
        type: string
      version_tag:
        description: 'Git ref (tag/branch) (optional)'
        required: false
        type: string
      package_dir:
        description: 'Explicit project directory containing pyproject.toml'
        default: '.'
        required: false
        type: string
      target_python_version:
        description: 'Python version'
        required: false
        default: '3.13'
        type: choice
        options: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
      android_api:
        description: 'Android API level'
        required: false
        default: '24'
        type: string

      publication:
        description: 'Publish wheels or retain Actions artifacts only'
        required: true
        default: publish
        type: choice
        options: [publish, build]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
      publication: ${{ steps.plan.outputs.publication }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - name: Resolve source and plan targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B -m scripts.pipeline plan-source --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: build-plan.json
          if-no-files-found: error
  build:
    name: Batch ${{ matrix.batch }}
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-wheel-batch.yml
    with:
      batch: ${{ matrix.batch }}
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publication == 'publish' && needs.plan.outputs.has_jobs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
      - uses: ./.github/actions/publish-wheels
