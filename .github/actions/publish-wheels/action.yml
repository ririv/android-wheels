name: Publish verified wheels
description: Verify the complete build and publish it in one commit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-plan
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-android-*-wheel-*'
        path: artifacts
    - name: Verify and publish the complete build
      id: publish
      shell: bash
      run: python -B -m scripts.pipeline publish --artifacts artifacts --github-output "$GITHUB_OUTPUT"
    - name: Trigger index deployment once
      if: steps.publish.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --ref main
