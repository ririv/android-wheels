name: Publish verified wheels
description: Verify the complete build and publish it in one commit
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-plan
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-android-*-wheel-*'
        path: artifacts
    - name: Verify and publish the complete build
      shell: bash
      run: python -B -m scripts.pipeline publish --artifacts artifacts
    - name: Trigger index deployment once
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -B -m scripts.pipeline notify-index --repository "$GITHUB_REPOSITORY"
