name = "grpcio"
pypi-version = "1.85.0"
directory = "."
backend = "setuptools.build_meta"

[android]
python = ["3.13"]
abis = ["arm64-v8a", "x86_64"]
api = 24

[environment]
GRPC_PYTHON_CFLAGS = "-std=c++17 -fvisibility=hidden -fno-wrapv -fno-exceptions"
GRPC_PYTHON_LDFLAGS = "-latomic"
GRPC_PYTHON_BUILD_EXT_COMPILER_JOBS = "2"
