name = "shapely"
pypi-version = "2.2.0"
directory = "."
backend = "mesonpy"
native-dependencies = ["geos"]

[android]
python = ["3.12", "3.13", "3.14", "3.15"]
abis = ["arm64-v8a", "x86_64"]
api = 24

[environment]
PIP_EXTRA_INDEX_URL = "https://ririv.github.io/py-extra-wheels"

[config-settings]
setup-args = ["--cross-file={workspace}/scripts/build/meson/{abi}.ini"]
compile-args = ["-j2"]
