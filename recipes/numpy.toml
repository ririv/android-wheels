name = "numpy"
pypi-version = "2.5.4"
directory = "."
backend = "mesonpy"
native-dependencies = ["openblas"]

[android]
python = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
abis = ["arm64-v8a", "x86_64"]
api = 24

[config-settings]
setup-args = "-Dblas=openblas -Dlapack=openblas -Duse-ilp64=false -Dallow-noblas=false"
