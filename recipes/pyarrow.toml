name = "pyarrow"
pypi-version = "26.0.0"
directory = "."
backend = "scikit_build_core.build"
native-dependencies = ["openssl", "arrow"]

[android]
python = ["3.12", "3.13", "3.14", "3.15"]
abis = ["arm64-v8a", "x86_64"]
api = 26

[environment]
PIP_EXTRA_INDEX_URL = "https://ririv.github.io/py-extra-wheels"
CMAKE_BUILD_PARALLEL_LEVEL = "2"
SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYARROW = "26.0.0"

[config-settings]
"cmake.define.PYARROW_BUNDLE_ARROW_CPP" = "ON"
"cmake.define.CMAKE_PROJECT_INCLUDE_BEFORE" = "{workspace}/scripts/build/cmake/android-native-prefix.cmake"
"cmake.define.CMAKE_C_STANDARD_LIBRARIES" = "-lpython{python}"
"cmake.define.CMAKE_CXX_STANDARD_LIBRARIES" = "-lpython{python} -fuse-ld=lld"
"cmake.define.CMAKE_PROJECT_INCLUDE" = "{workspace}/scripts/build/cmake/android-rpath.cmake"
"cmake.define.PYARROW_BUILD_PARQUET_ENCRYPTION" = "ON"
"cmake.define.CMAKE_PLATFORM_NO_VERSIONED_SONAME" = "OFF"
