name = "pyarrow"
pypi-version = "26.0.0"
directory = "."
backend = "scikit_build_core.build"
native-dependencies = ["openssl", "arrow"]

[android]
python = ["3.12", "3.13", "3.14", "3.15"]
abis = ["arm64-v8a", "x86_64"]
api = 26

[environment]
PIP_EXTRA_INDEX_URL = "https://ririv.github.io/py-extra-wheels"
CMAKE_BUILD_PARALLEL_LEVEL = "2"

[config-settings]
"cmake.define.PYARROW_BUNDLE_ARROW_CPP" = "ON"
"cmake.define.CMAKE_PREFIX_PATH" = "{workspace}/.native-prefix"
"cmake.define.CMAKE_C_STANDARD_LIBRARIES" = "-lpython{python}"
"cmake.define.CMAKE_CXX_STANDARD_LIBRARIES" = "-lpython{python} -fuse-ld=lld"
