name = "rapidfuzz"
pypi-version = "3.14.6"
directory = "."
backend = "scikit_build_core.build"

[android]
python = ["3.13"]
abis = ["arm64-v8a", "x86_64"]
api = 24

[environment]
RAPIDFUZZ_BUILD_EXTENSION = "1"

[config-settings]
"cmake.define.CMAKE_ANDROID_NDK_VERSION" = "27.3.13750724"
"cmake.define.CMAKE_C_STANDARD_LIBRARIES" = "-lpython3.13"
"cmake.define.CMAKE_CXX_STANDARD_LIBRARIES" = "-lpython3.13"
