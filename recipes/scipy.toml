name = "scipy"
pypi-version = "1.18.1"
directory = "."
backend = "mesonpy"
native-dependencies = ["openblas"]
build-tools = ["fortran"]

[android]
python = ["3.12", "3.13", "3.14", "3.15"]
abis = ["arm64-v8a"]
api = 26

[environment]
PIP_EXTRA_INDEX_URL = "https://ririv.github.io/py-extra-wheels"

[config-settings]
setup-args = ["--cross-file={workspace}/scripts/build/meson/{abi}.ini", "-Dblas=openblas", "-Dlapack=openblas", "-Duse-ilp64=false", "-Dcpp_args=-U_GNU_SOURCE"]
compile-args = ["-j2"]
